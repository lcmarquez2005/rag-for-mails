[tool.poetry]
name = "rag-for-mails"
version = "0.1.0"
description = "Sistema automatizado de extraccion, validacion y sincronizacion de reportes de correo con LangChain, Ollama y Pydantic"
authors = ["lcmarquez"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
pydantic = "^2.6.0"
langchain = "^0.2.0"
langchain-core = "^0.2.0"
langchain-ollama = "^0.1.0"
openpyxl = "^3.1.2"
google-api-python-client = "^2.200.0"
google-auth-httplib2 = "^0.4.2"
google-auth-oauthlib = "^1.4.1"
beautifulsoup4 = "^4.15.0"
fastapi = "^0.141.1"
uvicorn = {extras = ["standard"], version = "^0.52.4"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
httpx = "^0.28.1"

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
